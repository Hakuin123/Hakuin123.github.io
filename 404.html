<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>正在跳转...</title>
    <script type="text/javascript">
        // 获取当前的路径和查询参数
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        // 构建目标 URL
        var targetDomain = "https://www.hk256.top";
        var newUrl = targetDomain + path + search + hash;

        // 执行跳转
        window.location.replace(newUrl);
    </script>
</head>
<body>
    <p>页面不存在，正在尝试跳转到主站...</p>
    <p>如果浏览器没有自动跳转，请<a id="fallback" href="https://www.hk256.top">点击这里</a>。</p>
    <script>
        // 设置一个备选链接，以防 JS 失败
        document.getElementById('fallback').href = "https://www.hk256.top" + window.location.pathname;
    </script>
</body>
</html>
